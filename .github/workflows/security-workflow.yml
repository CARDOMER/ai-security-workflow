name: Security workflow

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      project-directory:
        description: Kotlin/Gradle project path relative to the caller checkout
        type: string
        default: '.'
      scanner-ref:
        description: Revision of CARDOMER/ai-security-workflow to run
        type: string
        default: public-demo
  workflow_dispatch:
    inputs:
      scenario:
        description: Authorized training scenario
        type: choice
        default: clean-training
        options:
          - clean-training
          - repair-desk

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_SUMMARY_PROVIDER: rules
      WORKFLOW_PUBLIC_DEMO: '0'
      SCENARIO: ${{ inputs.scenario || 'clean-training' }}
      PROJECT_DIRECTORY: ${{ inputs['project-directory'] || vars.SECURITY_PROJECT_DIRECTORY }}
    steps:
      - name: Check out the scanner
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['scanner-ref'] && 'CARDOMER/ai-security-workflow' || github.repository }}
          ref: ${{ inputs['scanner-ref'] || github.sha }}
          path: scanner
          persist-credentials: false
      - name: Check out the project revision
        if: ${{ env.PROJECT_DIRECTORY != '' && inputs.scenario == '' }}
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch the pinned training dataset
        working-directory: scanner
        run: |
          git init test-data
          git -C test-data fetch --depth 1 https://github.com/TBagirov/training.git fe1fcbe212669783480666b9b60147c8a8c6eef4
          git -C test-data checkout --detach FETCH_HEAD
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
        working-directory: scanner
      - name: Run the security gate
        working-directory: scanner
        env:
          TRAINING_SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ -n "$PROJECT_DIRECTORY" && -z "$TRAINING_SCENARIO" ]]; then
            project_checkout="$GITHUB_WORKSPACE/project"
            python -m backend.ci --project "$project_checkout/$PROJECT_DIRECTORY" --checkout "$project_checkout"
          else
            python -m backend.ci "$SCENARIO"
          fi
      - name: Upload the report and gate status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ env.PROJECT_DIRECTORY != '' && inputs.scenario == '' && 'project' || env.SCENARIO }}
          path: scanner/ci-artifacts/
          if-no-files-found: error
